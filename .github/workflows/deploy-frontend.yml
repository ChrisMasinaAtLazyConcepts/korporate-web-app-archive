name: Deploy React Frontend to Azure Static Web Apps

on:
  push:
    branches: [ master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

env:
  AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
  RESOURCE_GROUP: memory-game-rg
  APP_NAME: memory-game-frontend

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Build React app
      run: |
        cd frontend
        npm run build
      env:
        REACT_APP_API_URL: https://memory-game-spring-enquiry-api.azuremicroservices.io

    - name: Deploy to Azure Static Web App
      id: deploy
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: "upload"
        app_location: "frontend"
        output_location: "build"
        app_build_command: "npm run build"
        
    - name: Run smoke test
      run: |
        echo "Frontend deployed successfully"
        # Static Web App URL will be: https://memory-game-frontend.azurestaticapps.net